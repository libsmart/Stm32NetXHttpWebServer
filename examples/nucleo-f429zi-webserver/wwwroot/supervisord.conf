[supervisord]
nodaemon=true
user=root
directory=/opt/supervisord

[program:mitmproxy]
command=mitmweb --set confdir=/opt/mitmproxy --listen-port 18080 --web-host 0.0.0.0 --web-port 18081 --script redir.py --mode reverse:http://178.22.108.94:40021
directory=/opt/mitmproxy
autostart=true
autorestart=true
#stderr_logfile=/var/log/mitmproxy.err.log
#stdout_logfile=/var/log/mitmproxy.out.log
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:php-server]
command=php -S 0.0.0.0:18000 -t /var/www/html
directory=/var/www/html
autostart=true
autorestart=true
#stderr_logfile=/var/log/php-server.err.log
#stdout_logfile=/var/log/php-server.out.log
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
